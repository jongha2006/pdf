<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="apple-touch-icon.png"><title>StudySync</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#e9eef8;background:#0c1220}*{box-sizing:border-box}body{margin:0}header{padding:18px 16px 12px;background:#131e32;display:flex;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}small{color:#9fb0cc}.wrap{max-width:760px;margin:auto}.panel{padding:14px 16px}.card{background:#17243a;border:1px solid #2b3d58;border-radius:16px;padding:14px;margin-bottom:12px}input,button{font:inherit}input[type=text]{width:100%;background:#0d1728;border:1px solid #40516c;color:white;padding:12px;border-radius:10px}input[type=file]{width:100%;font-size:13px}label{display:block;color:#c4d0e3;font-size:13px;margin:10px 0 5px}button{border:0;border-radius:10px;background:#30425e;color:white;padding:11px 14px;cursor:pointer}button.primary{background:#4b79ec;color:white;font-weight:700}button:disabled{opacity:.4}.flex{display:flex;gap:8px;align-items:center}.flex>*{min-width:0}.grow{flex:1}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #30405a}.item:last-child{border:0}.tabs{display:flex;gap:8px;padding:10px 16px;background:#131e32}.tabs button{flex:1}.tabs .active{background:#4b79ec}.viewer{padding:12px;min-height:40vh;display:flex;align-items:flex-start;justify-content:center;overflow:auto;background:#0a1020}canvas{display:block;max-width:none;background:white;box-shadow:0 4px 18px #0006}.toolbar{position:sticky;bottom:0;background:#131e32;padding:12px 12px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;gap:6px;align-items:center}.toolbar button{padding:10px}.muted{color:#9fb0cc;font-size:13px}.hidden{display:none}.center{text-align:center}.pill{font-size:12px;background:#283d5e;padding:6px 9px;border-radius:20px}#status{padding:5px 16px;font-size:12px;color:#b6c6df}
</style></head><body><div class="wrap"><header><div><h1>📚 StudySync</h1><small>아이폰용 PDF 학습 뷰어</small></div><button id="homeBtn">자료함</button></header><section id="library" class="panel"><div class="card"><b>새 학습 세트</b><label>과목 / 주차 이름</label><input id="title" type="text" placeholder="예: C언어 3주차"><label>교수님 PPT (PDF)</label><input id="ppt" type="file" accept="application/pdf,.pdf"><label>GPT 해설 (PDF)</label><input id="notes" type="file" accept="application/pdf,.pdf"><p><button class="primary" id="save">자료 저장하기</button></p><small>파일은 이 기기의 브라우저에 저장됩니다. 기기 간 자동 동기화는 아직 지원하지 않습니다.</small></div><div class="card"><b>내 자료</b><div id="items" class="muted" style="margin-top:10px">불러오는 중...</div></div></section><section id="reader" class="hidden"><div class="panel flex"><strong id="setTitle" class="grow"></strong><span class="pill" id="fileName"></span></div><div class="tabs"><button id="pptTab" class="active">📑 교수님 PPT</button><button id="notesTab">💡 GPT 해설</button></div><div id="status">PDF를 불러오는 중...</div><div class="viewer" id="viewer"><canvas id="canvas"></canvas></div><div class="toolbar"><button id="prev">◀</button><span id="pageLabel" class="muted">0 / 0</span><button id="next">▶</button><button id="zoomOut">−</button><span id="zoomLabel" class="muted">100%</span><button id="zoomIn">＋</button></div></section></div><script type="module">
import * as pdfjsLib from 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.mjs';
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.mjs';
const $=id=>document.getElementById(id);let db,active=null,kind='ppt',pdf=null,zoom=1,renderToken=0,renderTask=null;const state={ppt:1,notes:1};
function req(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function init(){const open=indexedDB.open('studysync',1);open.onupgradeneeded=()=>open.result.createObjectStore('sets',{keyPath:'id',autoIncrement:true});db=await req(open);await list()}
function store(mode='readonly'){return db.transaction('sets',mode).objectStore('sets')}
async function list(){const all=await req(store().getAll());$('items').innerHTML='';if(!all.length){$('items').textContent='아직 저장한 자료가 없어요.';return}all.sort((a,b)=>b.id-a.id).forEach(x=>{const div=document.createElement('div');div.className='item';const name=document.createElement('span');name.textContent=x.title;name.className='grow';const open=document.createElement('button');open.textContent='열기';open.onclick=()=>openSet(x.id);const del=document.createElement('button');del.textContent='삭제';del.onclick=async()=>{if(confirm('이 자료를 삭제할까요?')){await req(store('readwrite').delete(x.id));await list()}};div.append(name,open,del);$('items').append(div)})}
$('save').onclick=async()=>{const title=$('title').value.trim(),ppt=$('ppt').files[0],notes=$('notes').files[0];if(!title||!ppt||!notes){alert('이름과 PDF 두 개를 모두 선택해 주세요.');return}if(![ppt,notes].every(f=>f.name.toLowerCase().endsWith('.pdf'))){alert('PDF 파일만 선택해 주세요.');return}try{await req(store('readwrite').add({title,ppt,notes,pptPage:1,notesPage:1}));$('title').value='';$('ppt').value='';$('notes').value='';await list();alert('저장했어요!')}catch(e){alert('저장 실패: 브라우저 저장 공간을 확인해 주세요.')}};
async function openSet(id){active=await req(store().get(id));state.ppt=active.pptPage||1;state.notes=active.notesPage||1;kind='ppt';zoom=1;$('library').classList.add('hidden');$('reader').classList.remove('hidden');$('setTitle').textContent=active.title;await loadPdf()}
async function loadPdf(){const token=++renderToken;pdf=null;$('status').textContent='PDF를 불러오는 중...';$('pptTab').classList.toggle('active',kind==='ppt');$('notesTab').classList.toggle('active',kind==='notes');$('fileName').textContent=kind==='ppt'?'PPT':'해설';try{const data=new Uint8Array(await active[kind].arrayBuffer());const doc=await pdfjsLib.getDocument({data}).promise;if(token!==renderToken){await doc.destroy();return}pdf=doc;state[kind]=Math.max(1,Math.min(state[kind],pdf.numPages));await render()}catch(e){if(token===renderToken)$('status').textContent='열기 실패: '+e.message}}
async function render(){if(!pdf)return;const token=++renderToken;try{if(renderTask){try{renderTask.cancel();await renderTask.promise}catch(e){}renderTask=null}const page=await pdf.getPage(state[kind]);if(token!==renderToken)return;const base=page.getViewport({scale:1});const width=Math.max(260,$('viewer').clientWidth-24);const scale=width/base.width*zoom;const viewport=page.getViewport({scale});const ratio=Math.min(window.devicePixelRatio||1,2);const canvas=$('canvas');canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';const ctx=canvas.getContext('2d');renderTask=page.render({canvasContext:ctx,viewport,transform:[ratio,0,0,ratio,0,0]});await renderTask.promise;if(token!==renderToken)return;$('pageLabel').textContent=`${state[kind]} / ${pdf.numPages}`;$('zoomLabel').textContent=Math.round(zoom*100)+'%';$('status').textContent='';$('viewer').scrollTop=0;active[kind+'Page']=state[kind];await req(store('readwrite').put(active))}catch(e){if(e.name!=='RenderingCancelledException'&&token===renderToken)$('status').textContent='표시 오류: '+e.message}}
$('pptTab').onclick=()=>{if(kind!=='ppt'){kind='ppt';zoom=1;loadPdf()}};$('notesTab').onclick=()=>{if(kind!=='notes'){kind='notes';zoom=1;loadPdf()}};$('prev').onclick=()=>{if(pdf&&state[kind]>1){state[kind]--;render()}};$('next').onclick=()=>{if(pdf&&state[kind]<pdf.numPages){state[kind]++;render()}};$('zoomIn').onclick=()=>{zoom=Math.min(3,zoom+.25);render()};$('zoomOut').onclick=()=>{zoom=Math.max(.5,zoom-.25);render()};$('homeBtn').onclick=()=>{$('reader').classList.add('hidden');$('library').classList.remove('hidden');active=null;pdf=null;renderToken++;list()};let startX=0;$('viewer').addEventListener('touchstart',e=>{startX=e.touches[0].clientX},{passive:true});$('viewer').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>90&&zoom===1&&pdf){if(d<0&&state[kind]<pdf.numPages)state[kind]++;else if(d>0&&state[kind]>1)state[kind]--;render()}},{passive:true});init().catch(e=>$('items').textContent='저장소 초기화 실패: '+e.message);
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
